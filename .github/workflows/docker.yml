name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Lets the amd64 runner build the arm64 image via QEMU emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token has packages:write, no secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # push to main -> :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # push tag v2.4.3 -> :2.4.3 and :latest
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # helm ships on the ubuntu-latest runner image, no setup action needed.
      - name: Publish Helm chart as OCI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HELM_USER: ${{ github.actor }}
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "$HELM_USER" --password "$HELM_TOKEN"
          helm package "chart/m3u4me" --version "$VERSION" --app-version "$VERSION" --destination /tmp
          helm push "/tmp/m3u4me-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
